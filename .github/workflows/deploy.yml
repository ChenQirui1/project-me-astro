name: Build and deploy

# Confluence is the source of truth for project content, and the sync runs
# here — in the runner's filesystem, never committed. The repo stays code and
# styling; the content exists only in this job and in the deployed output.
#
# Two things deploy the site, and both run the same build, so every deploy
# carries the current code *and* the current Confluence content:
#
#   push to master        a code or styling change
#   repository_dispatch   a Confluence automation rule, fired on publish
#
# Cloudflare is still the runtime — this only replaces Workers Builds as the
# builder, which rejects its own freshly-issued build tokens.
on:
  push:
    branches: [master]
  repository_dispatch:
    types: [confluence-publish]
  workflow_dispatch:

# Never let two runs race on the same deployment.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: astro/.node-version
          cache: pnpm
          cache-dependency-path: astro/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Guards the storage-format -> Markdown conversion before a mangled post
      # can reach the deployed site.
      - run: pnpm test

      # `build:ci` = sync Confluence -> mirror attachments to R2 -> astro build.
      # A failure here leaves the previous deployment live, so a bad sync or an
      # expired token cannot take the site down.
      - name: Build
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_ROOT: ${{ vars.CONFLUENCE_ROOT }}
          CONFLUENCE_PUBLISH_STATUS: ${{ vars.CONFLUENCE_PUBLISH_STATUS || 'Ready for Publish' }}
          CONFLUENCE_SPACE_KEY: ${{ vars.CONFLUENCE_SPACE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm build:ci

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
